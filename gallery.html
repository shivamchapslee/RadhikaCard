<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLaddo</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <noscript>
        <style>
            /* Ensure images are visible if JavaScript is disabled */
            .image-container { opacity: 1 !important; transform: none !important; }
            .image-container .grid-item { opacity: 1 !important; transform: none !important; }
        </style>
    </noscript>
</head>
<body class="gallery-page">
    <a class="back-link" href="index.html" aria-label="Back to home">← Back</a>
    <div class="image-container">
        <img class="grid-item" src="./assets/images/image1.jpg" alt="Image 1">
        <img class="grid-item" src="./assets/images/image2.jpg" alt="Image 2">
        <img class="grid-item" src="./assets/images/image3.jpg" alt="Image 3">
        <img class="grid-item" src="./assets/images/image4.jpg" alt="Image 4">
        <div class="gallery-message" role="status" aria-live="polite">
            <div class="message-title">💖 Thank you for choosing me, Love! 💖</div>
            <div class="message-sub">Be ready for more surprises! 💖</div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
